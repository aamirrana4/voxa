# Render blueprint — one-click deploy for Voxa.
# Render dashboard → New → Web Service → Public Git repository → paste repo URL.
# Then add env var AI33_API_KEY in the dashboard (never commit the key).
services:
  - type: web
    name: voxa-ai-voice-studio
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 300
    healthCheckPath: /api/ping
    envVars:
      - key: AI33_API_KEY
        sync: false
